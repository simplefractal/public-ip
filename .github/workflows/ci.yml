name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Run Tests
        run: yarn test

      - name: Check dist is up to date
        run: |
          yarn build
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is stale. Run 'yarn build' and commit the result."
            exit 1
          fi

      - name: Integration
        id: ip
        uses: ./

      - name: Assert an address was returned
        run: |
          echo "ipv4: ${{ steps.ip.outputs.ipv4 }}"
          echo "ipv6: ${{ steps.ip.outputs.ipv6 }}"
          test -n "${{ steps.ip.outputs.ipv4 }}"

      - name: Code Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
